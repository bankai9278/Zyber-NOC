{# Self-drawn line icons. stroke uses currentColor so CSS controls colour. #}
{% macro icon(name) -%}
<svg class="icon icon-{{ name }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "add" -%}
  <rect x="5" y="7" width="22" height="18" rx="3"/><path d="M16 12v8M12 16h8"/>
{%- elif name == "ping" -%}
  <circle cx="16" cy="16" r="2.2"/><path d="M10.5 10.5a8 8 0 0 0 0 11M21.5 10.5a8 8 0 0 1 0 11M6.5 6.5a13.5 13.5 0 0 0 0 19M25.5 6.5a13.5 13.5 0 0 1 0 19"/>
{%- elif name == "store" -%}
  <ellipse cx="16" cy="8" rx="9" ry="3.2"/><path d="M7 8v16c0 1.8 4 3.2 9 3.2s9-1.4 9-3.2V8M7 16c0 1.8 4 3.2 9 3.2s9-1.4 9-3.2"/>
{%- elif name == "see" -%}
  <rect x="4" y="6" width="24" height="17" rx="2.5"/><path d="M11 27h10M16 23v4M8 18l4-4 3 3 4-6 5 5"/>
{%- elif name == "python" -%}

{%- elif name == "flask" -%}

{%- elif name == "sqlite" -%}

{%- elif name == "svg" -%}
  <path d="M5 25C9 9 23 23 27 7"/><circle cx="5" cy="25" r="2"/><circle cx="27" cy="7" r="2"/><path d="M5 25l6-12M27 7l-6 12"/><circle cx="11" cy="13" r="1.4"/><circle cx="21" cy="19" r="1.4"/>
{%- elif name == "js" -%}

{%- elif name == "arrow" -%}

{%- endif -%}
</svg>
{%- endmacro %}
