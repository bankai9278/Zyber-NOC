{% extends "base.html" %}

{% block title %}Add device{% endblock %}

{% block content %}
  <p class="back-link"><a href="{{ url_for('devices.inventory') }}">Back to dashboard</a></p>
  <h1>Add device</h1>
  <p class="lede">Enter a device you are allowed to monitor. Each IP address can be saved once.</p>
  {% if error %}
    <p class="error" id="form-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('devices.create_device') }}" {% if error %}aria-describedby="form-error"{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="name">Device name</label>
    <input id="name" name="name" value="{{ device.name }}" required maxlength="100" autocomplete="off" {% if error and not device.name.strip() %}aria-invalid="true"{% endif %}>

    <label for="ip_address">IP address</label>
    <input id="ip_address" name="ip_address" value="{{ device.ip_address }}" required inputmode="decimal" spellcheck="false" autocomplete="off" {% if error and "IP" in error %}aria-invalid="true"{% endif %}>

    <label for="device_type">Device type</label>
    <input id="device_type" name="device_type" value="{{ device.device_type }}" required maxlength="50" placeholder="router, switch, server" autocomplete="off" {% if error and not device.device_type.strip() %}aria-invalid="true"{% endif %}>

    <label for="description">Description <span class="optional">(optional)</span></label>
    <textarea id="description" name="description" maxlength="500" rows="3">{{ device.description }}</textarea>

    <div class="actions">
      <button type="submit" data-loading-label="Saving device">Save device</button>
      <a href="{{ url_for('devices.inventory') }}">Cancel</a>
    </div>
  </form>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/forms.js') }}"></script>
{% endblock %}
